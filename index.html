<style>
body{margin:0;background:#0a0a0a;font-family:system-ui,sans-serif;color:white}
.wrap{max-width:760px;margin:0 auto;padding:12px}
.card{background:#1a1a1a;border-radius:20px;padding:20px;border:1px solid #2a2a2a}
.icon{width:80px;height:80px;border-radius:20px;background:#2a2a2a;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:16px}
.screens{display:flex;gap:10px;overflow:auto;padding:12px 0}
.screens img{height:240px;border-radius:16px;border:1px solid #333;flex-shrink:0}
.btn{width:100%;background:#7c3aed;color:white;border:0;padding:18px;border-radius:16px;font-weight:800;font-size:17px;cursor:pointer}
.btn-chrome{width:100%;background:#fff;color:#000;border:0;padding:16px;border-radius:16px;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-share{width:100%;background:#121212;color:#fff;border:1px solid #333;padding:14px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.badge{background:#2a2a2a;padding:5px 12px;border-radius:20px;font-size:11px;color:#aaa}
.longBox{background:#121212;padding:16px;border-radius:14px;font-size:13px;white-space:pre-wrap;line-height:1.6;color:#ccc;border:1px solid #222}
.fb-warning{background:#ffcc00;color:#000;padding:14px;border-radius:14px;margin-bottom:14px;font-size:13px;font-weight:700;line-height:1.4;display:none}
.fb-warning b{color:#000}
/* SPLASH B */
#loading{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%, #1a0f2e 0%, #0a0a0a 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.splash-logo{width:96px;height:96px;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;animation:pulse 1.6s infinite;box-shadow:0 20px 60px rgba(124,58,237,.5)}
.splash-logo img{width:100%;height:100%;object-fit:cover;border-radius:24px}
.splash-title{margin-top:18px;font-size:24px;font-weight:800;letter-spacing:.5px}
.splash-sub{margin-top:6px;font-size:13px;color:#888}
.splash-bar{margin-top:20px;width:120px;height:4px;background:#222;border-radius:99px;overflow:hidden}
.splash-bar>div{height:100%;width:40%;background:#7c3aed;border-radius:99px;animation:load 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
</style>

firebase.initializeApp(cfg);
var db=firebase.firestore();
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').then(r=>console.log('SW OK')).catch(e=>console.log('SW FAIL',e)); }

// DETECTAR FACEBOOK / MESSENGER / INSTAGRAM - solo por UA, no por fbclid para evitar bucle Chrome
function isFacebookBrowser(){
  var ua = navigator.userAgent || '';
  ua = ua.toLowerCase();
  return ua.indexOf("fban")>-1 || ua.indexOf("fbav")>-1 || ua.indexOf("fb_iab")>-1 || ua.indexOf("fb4a")>-1 || (ua.indexOf("fb")>-1 && ua.indexOf("facebook")>-1) || ua.indexOf("fban")>-1;
}
function isFacebookLite(){ return /fban.*fblc|fb_iab|fb4a/i.test(navigator.userAgent||''); }

var deferredPrompt=null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt=e;
  var b=document.getElementById('installBtn');
  if(b){ b.textContent='↓ Instalar Vibra'; b.style.opacity='1'; }
});

var params=new URLSearchParams(location.search);
var id=params.get('id');
var mode=params.get('mode');
if(id){ try{ localStorage.setItem('lastVibraId', id); }catch(e){} }
if(!id){ try{ id=localStorage.getItem('lastVibraId'); }catch(e){} }

function showStore(appId){
  db.collection('apps').doc(appId).get().then(doc=>{
    if(!doc.exists){ document.getElementById('loading').innerHTML='App no encontrada'; return; }
    var a=doc.data();
    document.getElementById('loading').style.display='none';
    document.getElementById('store').style.display='block';
    var c=document.getElementById('store');
    var icon=a.iconBase64?`<img src="${a.iconBase64}">`:'';
    var isFB = isFacebookBrowser(); try{ if(sessionStorage.getItem("fb_auto_tried") && !isFB) isFB=false; }catch(e){}
    c.innerHTML=`

      <div class="card">
        <div class="row"><div class="icon">${icon}</div>
        <div style="flex:1"><h2 style="margin:0;font-size:22px;font-weight:800;color:white">${esc(a.name)}</h2>
        <div style="font-size:12px;color:#888">By ${esc(a.creatorName||'Orlando Claro')}</div>
        <div style="margin-top:8px;display:flex;gap:6px"><span class="badge">${esc(a.version||'v2.1')}</span><span class="badge">${esc(a.packageName||'com.vibra.app')}</span></div></div></div>
        <p style="font-size:13px;margin-top:14px;color:#ccc">${esc(a.shortDesc||'')}</p>
        ${isFB ? `<button class="btn-chrome" id="openChromeBtn">🌐 Abrir en Chrome para instalar</button>` : ''}

        <button class="btn-share" onclick="shareVibra()">📤 Compartir Vibra con amigos</button>
        <div id="fbHelp" style="display:${isFB?'block':'none'};margin-top:10px;font-size:11px;color:#ffcc00;text-align:center">Si no ves el botón de Chrome, toca ⋮ → Abrir en navegador</div>
        <h3 style="font-size:13px;font-weight:700;margin-top:22px;color:white">Screenshots</h3>
        <div class="screens" id="scr"></div>
        <div style="margin-top:18px"><div style="font-size:12px;font-weight:700;color:white">Descripción</div><div class="longBox">${esc(a.longDesc||'')}</div></div>
      </div>
    `;
    var scr=document.getElementById('scr');
    (a.screenshots||[]).forEach(src=>{ var img=document.createElement('img'); img.src=src; scr.appendChild(img); });
    document.title=a.name+' - Instalar';

    var openChromeBtn=document.getElementById('openChromeBtn');
    var attemptedAutoOpen = false;
    function tryOpenChrome(){
      if(attemptedAutoOpen) return;
      attemptedAutoOpen = true;
      var url = window.location.href;
      var intentUrl = "intent://" + url.replace(/^https?:\/\//,'') + "#Intent;scheme=https;package=com.android.chrome;end";
      var chromeUrl = "googlechrome://navigate?url=" + encodeURIComponent(url);
      
      // Intento 1: intent (más efectivo en Android)
      try{
        var a = document.createElement('a');
        a.href = intentUrl;
        a.style.display='none';
        document.body.appendChild(a);
        a.click();
        // También probar con location
        setTimeout(function(){ try{ window.location.href = intentUrl; }catch(e){} }, 200);
        // Intento 2: esquema chrome
        setTimeout(function(){ try{ window.location.href = chromeUrl; }catch(e){} }, 600);
      }catch(e){
        try{ window.location.href = intentUrl; }catch(e2){}
      }
      
      // Si después de 2.5s sigue en FB, no se pudo, mostrar mensaje
      setTimeout(function(){
        if(isFacebookBrowser()){
          // sigue en FB, no abrió
          var warn = document.getElementById('fbWarn');
          if(warn) warn.innerHTML += '<br><br><div style="background:#000;color:#ffcc00;padding:10px;border-radius:8px">Si no abrió solo, toca el botón de abajo o toca ⋮ → Abrir en navegador externo</div>';
        }
      }, 2500);
    }

    // AUTO-INTENTO solo 1 vez y solo si es Facebook REAL, no Chrome con fbclid
    if(isFB && !attemptedAutoOpen){
      // Evitar bucle: marcar que ya intentamos en sessionStorage
      try{
        var tried = sessionStorage.getItem('fb_auto_tried');
        if(!tried){
          sessionStorage.setItem('fb_auto_tried','1');
          setTimeout(tryOpenChrome, 1000);
        }
      }catch(e){
        setTimeout(tryOpenChrome, 1000);
      }
    }

    if(openChromeBtn){
      openChromeBtn.onclick=function(){
        tryOpenChrome();
      };
    }
    
    var btn=document.getElementById('installBtn');
    if(deferredPrompt){ btn.textContent='↓ Instalar Vibra'; btn.style.opacity='1'; }
    
    btn.onclick=function(){ 
      if(isFacebookBrowser()){
        alert('Estás en Facebook / Messenger, no deja instalar.\n\nToca ⋮ arriba derecha → Abrir en navegador externo o Abrir en Chrome\n\nLuego te saldrá Instalar');
        if(openChromeBtn) openChromeBtn.click();
        return;
      }
      if(deferredPrompt){ 
        deferredPrompt.prompt(); 
        deferredPrompt.userChoice.then(ch=>{
          if(ch.outcome==='accepted'){ 
            btn.textContent='✅ ¡Instalada!';
            btn.style.background='#22c55e';
            // Mostrar botón de abrir y instrucciones
            var card = btn.parentElement;
            var openDiv = document.createElement('div');
            openDiv.innerHTML=`
              <div style="margin-top:14px;background:#111;border:1px solid #22c55e;border-radius:14px;padding:14px;text-align:center">
                <div style="font-size:28px">🎉</div>
                <div style="font-weight:800;margin-top:6px">Vibra instalada correctamente</div>
                <div style="font-size:12px;color:#aaa;margin-top:6px;line-height:1.4">
                  Si no ves el icono morado en tu inicio:<br>
                  1. Ve a tu cajón de apps (desliza hacia arriba)<br>
                  2. Busca "Vibra" (icono morado V)<br>
                  3. Mantén presionado → "Añadir a pantalla principal"<br><br>
                  O toca abajo para abrirla ahora:
                </div>
                <button id="openVibraNow" style="margin-top:12px;width:100%;background:white;color:black;border:0;padding:14px;border-radius:12px;font-weight:800;font-size:15px">🚀 Abrir Vibra ahora</button>
              </div>
            `;
            card.appendChild(openDiv);
            document.getElementById('openVibraNow').onclick=function(){
              window.location.href = './index.html?mode=app&id=' + (id||'');
            };
          }
          deferredPrompt=null;
        }); 
      } else {
        if(window.matchMedia('(display-mode: standalone)').matches){
          alert('Vibra ya está instalada');
        } else {
          // Si ya está instalada pero en otro perfil
          if(navigator.userAgent.indexOf('Chrome')>-1){
            alert('Si no sale el popup:\n\n1. Ya está instalada - busca el icono morado\n2. O toca ⋮ → Instalar app → Instalar');
          } else {
            alert('Abre este link en Chrome, no en Facebook Lite.\n\nToca ⋮ → Abrir en Chrome');
          }
        }
      }
    };
  });
}

function showApp(appId){
  db.collection('apps').doc(appId).get().then(doc=>{
    if(!doc.exists){ showStore(appId); return; }
    var a=doc.data();
    if(a.contentType==='url' && a.content){ location.href=a.content; return; }
    if(a.content && a.content.length>50){
      document.getElementById('loading').style.display='none';
      var appDiv=document.getElementById('vibraApp'); appDiv.style.display='block'; document.title=a.name||'Vibra';
      var ifr=document.createElement('iframe'); ifr.id='vibraFrame'; ifr.style.width='100%'; ifr.style.height='100vh'; ifr.style.border='0'; ifr.setAttribute('allow','notifications; fullscreen; autoplay'); appDiv.appendChild(ifr);
      try{ ifr.srcdoc=a.content; }catch(e){ var blob=new Blob([a.content],{type:'text/html'}); ifr.src=URL.createObjectURL(blob); }
      return;
    }
    showStore(appId);
  });
}

if(mode==='app'){
  if(id){ showApp(id); }
  else {
    try{ var saved=localStorage.getItem('lastVibraId'); if(saved) id=saved; }catch(e){}
    if(id){ showApp(id); }
    else {
      db.collection('apps').orderBy('createdAt','desc').limit(1).get().then(snap=>{
        if(snap.empty){ document.getElementById('loading').innerHTML='No hay apps en Firebase'; return; }
        var d=snap.docs[0]; showApp(d.id);
      });
    }
  }
} else {
  if(!id){
    db.collection('apps').orderBy('createdAt','desc').limit(1).get().then(snap=>{
      if(snap.empty){ document.getElementById('loading').innerHTML='No hay apps'; return; }
      var d=snap.docs[0]; id=d.id;
      try{ localStorage.setItem('lastVibraId', id); }catch(e){}
      showStore(id);
    });
  } else { showStore(id); }
}
</script>

<script>
// A: FCM para app cerrada (parent)
async function initParentFCM(){
  try{
    if(!('Notification' in window)) return;
    if(Notification.permission!=='granted') return;
    const messaging = firebase.messaging();
    let token=null;
    try{ token = await messaging.getToken({vapidKey: 'BLR8qR6R4XvR9k2xK7_example_replace_with_your_vapid'}); }catch(e){ token = await messaging.getToken().catch(()=>null); }
    if(token){
      try{
        let uid = localStorage.getItem('vibra_parent_uid') || 'parent_'+Math.random().toString(36).slice(2,9);
        localStorage.setItem('vibra_parent_uid', uid);
        await db.collection('vibra_tokens').doc(uid).set({token, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), type:'parent', ua: navigator.userAgent}, {merge:true});
        console.log('Parent FCM token guardado', token.slice(0,20));
      }catch(e){}
    }
    messaging.onMessage(payload=>{
      console.log('Parent FCM foreground', payload);
      try{ if('setAppBadge' in navigator && payload.data?.count) navigator.setAppBadge(parseInt(payload.data.count)); }catch(e){}
    });
  }catch(e){ console.log('Parent FCM err', e); }
}
if('Notification' in window && Notification.permission==='granted'){ setTimeout(initParentFCM, 2000); }

// C: Share function
function shareVibra(){
  const url = window.location.origin + window.location.pathname;
  const text = '🔥 Descarga Vibra - haz amigos cerca de ti. Radar por ciudad, chats reales y 100% privada. Instálala aquí: ';
  if(navigator.share){
    navigator.share({title:'Vibra - Haz amigos cerca', text: text, url: url}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text + url).then(()=>{
      alert('¡Link copiado! Compártelo en WhatsApp, Facebook o Instagram: \n\n' + url);
    }).catch(()=>{
      prompt('Copia este link:', url);
    });
  }
}
</script>
